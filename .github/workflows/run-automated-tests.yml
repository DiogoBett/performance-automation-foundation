name: Run Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - preprod
          - prod

env:
  MAVEN_CLI_OPTS: --batch-mode --no-transfer-progress

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compile Code
        run: mvn $MAVEN_CLI_OPTS clean test-compile

      - name: Check Dependencies
        run: mvn $MAVEN_CLI_OPTS dependency:resolve

      - name: Spotless Check
        run: mvn $MAVEN_CLI_OPTS spotless:check

      - name: Validate Run Selection
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          case "$TEST_ENVIRONMENT" in
            dev|preprod|prod) ;;
            *) echo "Unsupported environment: $TEST_ENVIRONMENT" >&2; exit 1 ;;
          esac
      - name: Environment Setup
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          case "$TEST_ENVIRONMENT" in
            dev)
              echo "Running all scenarios against DEV QuickPizza"
              base_url="https://quickpizza.grafana.com"
              smoke_path="/ready"
              expected_status="200"
              ;;
            preprod|prod)
              echo "$TEST_ENVIRONMENT is a placeholder and is not configured yet." >&2
              exit 1
              ;;
          esac
          echo "TEST_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "TEST_SMOKE_PATH=$smoke_path" >> "$GITHUB_ENV"
          echo "TEST_EXPECTED_STATUS=$expected_status" >> "$GITHUB_ENV"

      - name: Run Automated Tests
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: |
          failed=0
          results_file="$RUNNER_TEMP/allure-simulation-results.tsv"
          : > "$results_file"
          for simulation in \
            GenericSmokeSimulation \
            GenericLoadSimulation \
            GenericSpikeSimulation
          do
            started_at="$(date +%s%3N)"
            if mvn $MAVEN_CLI_OPTS gatling:test \
                "-Dgatling.simulationClass=io.github.diogobett.performance.$simulation" \
                "-Denvironment=$TEST_ENVIRONMENT" \
                "-DbaseUrl=$TEST_BASE_URL" \
                "-DsmokePath=$TEST_SMOKE_PATH" \
                "-DexpectedStatus=$TEST_EXPECTED_STATUS"; then
              status="passed"
            else
              status="failed"
              failed=1
            fi
            stopped_at="$(date +%s%3N)"
            printf '%s\t%s\t%s\t%s\n' \
              "$simulation" "$status" "$started_at" "$stopped_at" >> "$results_file"
          done
          if ! mvn $MAVEN_CLI_OPTS exec:java \
              "-Dexec.args=$results_file target/allure-results target/cucumber-report/performance-scenarios.json"; then
            failed=1
          fi
          exit "$failed"

      - name: Allure Report
        if: always()
        run: mvn $MAVEN_CLI_OPTS allure:report

      - name: Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_report
          path: |
            target/gatling/
            target/allure-results/
            target/allure-report/
            target/cucumber-report/
          if-no-files-found: warn
          retention-days: 7
